<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serviços — Blessed</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='catalogo.css') }}">
</head>
<body>
<div class="app app-semana">
<div class="estrutura-semana">

<aside class="lateral-marca">
    <div class="marca marca-lateral">
        <img src="{{ url_for('static', filename='blessed-logo.png') }}" class="logo-blessed" alt="Blessed">
    </div>

    <nav class="menu-principal">
        <a href="/semana" class="menu-item"><span class="menu-icone">▣</span><span>Agenda</span></a>
        <a href="/clientes" class="menu-item"><span class="menu-icone">♙</span><span>Clientes</span></a>
        <a href="/servicos" class="menu-item ativo"><span class="menu-icone">✂</span><span>Serviços</span></a>
        <a href="/produtos" class="menu-item"><span class="menu-icone">▤</span><span>Produtos</span></a>
        <button class="menu-item" type="button"><span class="menu-icone">✉</span><span>Comunicações</span></button>
        <button class="menu-item" type="button"><span class="menu-icone">⚙</span><span>Definições</span></button>
        <a href="https://blessed.pjcorelabs.com/cdn-cgi/access/logout" class="menu-item"><span class="menu-icone">⏻</span><span>Sair</span></a>
    </nav>
</aside>

<main class="main-semana catalogo-main">
    <section class="catalogo-topo">
        <div>
            <h1>Serviços</h1>
            <p>Lista de serviços da Barbearia Blessed.</p>
        </div>
        <a href="/semana" class="botao-voltar-catalogo">Voltar à agenda</a>
    </section>

    <section class="servicos-grade">
        {% for servico in servicos %}
        <article class="servico-simples">
            <span class="servico-tesoura">✂</span>
            <strong>{{ servico.nome }}</strong>
        </article>
        {% endfor %}
    </section>

    <div class="nota-demo">
        Esta área é independente das marcações. Serão adicionados apenas os serviços que o Bruno decidir.
    </div>
</main>

</div>
</div>
</body>
</html>
