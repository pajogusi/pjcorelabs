<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcar — Blessed Barbearia</title>
  <style>
    :root{color-scheme:dark;--gold:#d7aa56;--ink:#15120e;--paper:#f6f0e5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#15120e,#302419);font:16px system-ui;color:var(--paper)}main{max-width:680px;margin:auto;padding:36px 20px 60px}h1{color:var(--gold);margin-bottom:4px}.lead{opacity:.85;margin-top:0}.card{background:#f6f0e5;color:#1a1611;border-radius:16px;padding:24px;margin-top:24px;box-shadow:0 16px 50px #0007}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:650}input,select{font:inherit;padding:11px;border:1px solid #a59272;border-radius:8px;background:#fff}button{margin-top:20px;width:100%;padding:14px;border:0;border-radius:9px;background:#1c1711;color:var(--paper);font-size:16px;font-weight:750}.note{font-size:.9rem;color:#594b37}.error{padding:12px;background:#f6d9d5;border-radius:8px;color:#7c1b10}@media(max-width:520px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>Blessed Barbearia</h1><p class="lead">Marca o teu horário em poucos passos.</p>
  <section class="card">
    <h2>Nova marcação</h2>
    <p class="note">O sinal de £10 confirma a marcação. Tens 15 minutos para concluir o pagamento.</p>
    {% if erro %}<p class="error">{{ erro }}</p>{% endif %}
    <form method="post">
      <div class="grid">
        <label>Barbeiro<select name="barbeiro" required><option value="">Escolher</option><option value="primeiro">Primeiro disponível</option>{% for barbeiro in barbeiros %}<option value="{{ barbeiro.id }}">{{ barbeiro.nome }}</option>{% endfor %}</select></label>
        <label>Serviço<select name="servico" required>{% for servico in servicos %}<option>{{ servico }}</option>{% endfor %}</select></label>
        <label>Data e hora<input type="datetime-local" name="inicio" min="{{ hoje }}T08:00" required></label>
        <label>Duração<select name="duracao"><option value="30">30 minutos</option><option value="15">15 minutos</option><option value="45">45 minutos</option><option value="60">60 minutos</option></select></label>
        <label>Nome<input name="nome" autocomplete="name" required></label>
        <label>Telefone<input name="telefone" autocomplete="tel" inputmode="tel" required></label>
      </div>
      <label style="margin-top:14px">Email <small>(opcional)</small><input type="email" name="email" autocomplete="email"></label>
      <button type="submit">Continuar para pagamento · £10</button>
    </form>
  </section>
</main></body></html>
